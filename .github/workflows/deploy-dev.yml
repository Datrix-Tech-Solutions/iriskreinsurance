name: Deploy to Dev

on:
  push:
    branches: [dev]

# ── 1. Concurrency control ─────────────────────────────────────────────────────
# Allow a newer dev push to replace an older in-flight deployment.
concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: datrix-tech-solutions
  IMAGE_PREFIX: ghcr.io/datrix-tech-solutions/work-phelo
  COMPOSE_FILE: infrastructure/docker-compose.dev.yml
  DEPLOY_PATH: /var/www/apps/dev.workphelo.datrixtechsolutions.com/work-phelo
  WEB_PUBLIC_API_URL: https://dev-api.workphelo.com/api/v1
  WEB_PUBLIC_APP_BASE_URL: https://dev-app.workphelo.com
  BUILD_SHA: ${{ github.sha }}
  BUILD_REF: ${{ github.ref_name }}
  CHECKOUT_REF: ${{ github.sha }}

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type checks
        run: npm run check-types

      - name: Unit tests
        run: npm run test:unit

      - name: Build validation
        run: npm run build

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    needs: quality-gates

    # ── 6. Per-service boolean outputs ──────────────────────────────────────────
    # Each output is 'true'/'false' so the build matrix can skip unchanged services
    # without fragile inline jq parsing of a JSON array.
    outputs:
      changed: ${{ steps.filter.outputs.changes }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
      hr-service: ${{ steps.filter.outputs.hr-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      subscription-service: ${{ steps.filter.outputs.subscription-service }}
      marketing-service: ${{ steps.filter.outputs.marketing-service }}
      reinsurance-service: ${{ steps.filter.outputs.reinsurance-service }}
      accounting-service: ${{ steps.filter.outputs.accounting-service }}
      nextjs-web: ${{ steps.filter.outputs.nextjs-web }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api-gateway:
              - 'apps/api-gateway/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            auth-service:
              - 'apps/auth-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            hr-service:
              - 'apps/hr-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            notification-service:
              - 'apps/notification-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            subscription-service:
              - 'apps/subscription-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            marketing-service:
              - 'apps/marketing-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            reinsurance-service:
              - 'apps/reinsurance-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            accounting-service:
              - 'apps/accounting-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            nextjs-web:
              - 'apps/web/work-phelo-web/**'
          list-files: none

  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes

    if: needs.detect-changes.outputs.changed != '[]' && needs.detect-changes.outputs.changed != ''

    permissions:
      contents: read
      packages: write

    env:
      BUILDKIT_CACHE_SCOPE: ${{ matrix.service }}-dev
      BUILDKIT_CACHE_MODE: min
      BUILDKIT_CACHE_EXPORT_OPTIONAL: true

    # ── 2. Next.js moved into the unified change-filtered matrix ──────────────
    # All services share one job definition; per-service dockerfile paths are
    # declared here so there is no separate nextjs-build-push job to maintain.
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: apps/api-gateway/Dockerfile
          - service: auth-service
            dockerfile: apps/auth-service/Dockerfile
          - service: hr-service
            dockerfile: apps/hr-service/Dockerfile
          - service: notification-service
            dockerfile: apps/notification-service/Dockerfile
          - service: subscription-service
            dockerfile: apps/subscription-service/Dockerfile
          - service: marketing-service
            dockerfile: apps/marketing-service/Dockerfile
          - service: reinsurance-service
            dockerfile: apps/reinsurance-service/Dockerfile
          - service: accounting-service
            dockerfile: apps/accounting-service/Dockerfile
          - service: nextjs-web
            dockerfile: apps/web/work-phelo-web/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}

      # ── 6. Use per-service boolean output — no inline jq ──────────────────
      - name: Check if service changed
        id: changed
        env:
          SERVICE_CHANGED: ${{ needs.detect-changes.outputs[matrix.service] }}
        run: |
          if [[ "$SERVICE_CHANGED" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚡ ${{ matrix.service }} unchanged — skipping build"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.changed.outputs.skip == 'false'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Set up QEMU
        if: steps.changed.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.changed.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Log Docker cache settings
        if: steps.changed.outputs.skip == 'false'
        run: |
          echo "Image: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
          echo "BuildKit cache backend: gha"
          echo "BuildKit cache scope: ${BUILDKIT_CACHE_SCOPE}"
          echo "BuildKit cache mode: ${BUILDKIT_CACHE_MODE}"
          echo "BuildKit cache export optional: ${BUILDKIT_CACHE_EXPORT_OPTIONAL}"

      - name: Build and push ${{ matrix.service }}
        if: steps.changed.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:dev
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.BUILD_SHA }}
          cache-from: type=gha,scope=${{ env.BUILDKIT_CACHE_SCOPE }}
          cache-to: type=gha,scope=${{ env.BUILDKIT_CACHE_SCOPE }},mode=${{ env.BUILDKIT_CACHE_MODE }},ignore-error=true
          build-args: |
            BUILD_SHA=${{ env.BUILD_SHA }}
            BUILD_REF=${{ env.BUILD_REF }}
            NEXT_PUBLIC_API_URL=${{ env.WEB_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_BASE_URL=${{ env.WEB_PUBLIC_APP_BASE_URL }}
            NEXT_PUBLIC_ENABLE_ANNOUNCEMENT_SMS=true
            NEXT_PUBLIC_MAPTILER_KEY=${{ secrets.DEV_MAPTILER_KEY }}

  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    # ── 3. Fixed deploy condition ──────────────────────────────────────────────
    # Deploy if quality gates pass AND the build either succeeded or was
    # legitimately skipped (no services changed). Prevents deploying stale images
    # after a build failure.
    needs: [quality-gates, detect-changes, build-and-push]
    if: |
      always() &&
      needs.quality-gates.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')

    # ── 8. Use GITHUB_TOKEN for GHCR pull on the server ───────────────────────
    # packages: read grants the token pull access; no long-lived CR_PAT needed.
    permissions:
      contents: read
      packages: read

    environment:
      name: dev
      url: https://dev-app.workphelo.com

    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      AUTH_FRONTEND_BASE_URL: ${{ vars.AUTH_FRONTEND_BASE_URL }}
      AUTH_COOKIE_SECURE: ${{ vars.AUTH_COOKIE_SECURE }}
      AUTH_COOKIE_SAME_SITE: ${{ vars.AUTH_COOKIE_SAME_SITE }}
      AUTH_GOOGLE_CLIENT_ID: ${{ vars.AUTH_GOOGLE_CLIENT_ID }}
      AUTH_GOOGLE_CALLBACK_URL: ${{ vars.AUTH_GOOGLE_CALLBACK_URL }}
      AUTH_MICROSOFT_CLIENT_ID: ${{ vars.AUTH_MICROSOFT_CLIENT_ID }}
      AUTH_MICROSOFT_CALLBACK_URL: ${{ vars.AUTH_MICROSOFT_CALLBACK_URL }}
      AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.AUTH_GOOGLE_CLIENT_SECRET }}
      AUTH_MICROSOFT_CLIENT_SECRET: ${{ secrets.AUTH_MICROSOFT_CLIENT_SECRET }}
      NOTIFY_RESEND_FROM_EMAIL: ${{ vars.NOTIFY_RESEND_FROM_EMAIL }}
      NOTIFY_SMS_PROVIDER: ${{ vars.NOTIFY_SMS_PROVIDER }}
      NOTIFY_TERMII_SENDER_ID: ${{ vars.NOTIFY_TERMII_SENDER_ID }}
      NOTIFY_PILOSMS_SENDER_ID: ${{ vars.NOTIFY_PILOSMS_SENDER_ID }}
      NOTIFY_RESEND_API_KEY: ${{ secrets.NOTIFY_RESEND_API_KEY }}
      NOTIFY_TERMII_API_KEY: ${{ secrets.NOTIFY_TERMII_API_KEY }}
      NOTIFY_PILOSMS_API_KEY: ${{ secrets.NOTIFY_PILOSMS_API_KEY }}
      SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
      SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
      HR_FIELD_ENCRYPTION_KEY: ${{ secrets.HR_FIELD_ENCRYPTION_KEY }}
      HR_FIELD_HMAC_KEY: ${{ secrets.HR_FIELD_HMAC_KEY }}
      BUILD_SHA: ${{ github.sha }}
      BUILD_REF: ${{ github.ref_name }}
      IMAGE_PREFIX: ghcr.io/datrix-tech-solutions/work-phelo
      CHANGED_SERVICES: ${{ needs.detect-changes.outputs.changed }}
      WEB_PUBLIC_API_URL: https://dev-api.workphelo.com/api/v1
      WEB_PUBLIC_APP_BASE_URL: https://dev-app.workphelo.com
      AUTH_SERVICE_URL: ${{ vars.AUTH_SERVICE_URL }}
      AUTH_TENANT_ASSET_STORAGE_PROVIDER: ${{ vars.AUTH_TENANT_ASSET_STORAGE_PROVIDER }}
      AUTH_TENANT_ASSET_S3_BUCKET: ${{ vars.AUTH_TENANT_ASSET_S3_BUCKET }}
      AUTH_TENANT_ASSET_S3_REGION: ${{ vars.AUTH_TENANT_ASSET_S3_REGION }}
      AUTH_TENANT_ASSET_S3_PREFIX: ${{ vars.AUTH_TENANT_ASSET_S3_PREFIX }}
      AUTH_TENANT_ASSET_SIGNED_URL_TTL_SECONDS: ${{ vars.AUTH_TENANT_ASSET_SIGNED_URL_TTL_SECONDS }}
      AUTH_TENANT_ASSET_CLOUDINARY_ROOT_FOLDER: ${{ vars.AUTH_TENANT_ASSET_CLOUDINARY_ROOT_FOLDER }}
      CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      REINSURANCE_DOCUMENT_STORAGE_PROVIDER: cloudinary
      REINSURANCE_DOCUMENT_CLOUDINARY_ROOT_FOLDER: workphelo/reinsurance
      REINSURANCE_DOCUMENT_SIGNED_URL_TTL_SECONDS: 300
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      INTERNAL_SERVICE_AUTH_SECRET: ${{ secrets.INTERNAL_SERVICE_AUTH_SECRET }}
      INTERNAL_SERVICE_AUTH_ALLOWED_SERVICES: ${{ vars.INTERNAL_SERVICE_AUTH_ALLOWED_SERVICES }}
      REINSURANCE_TENANT_PROFILE_CACHE_TTL_SECONDS: ${{ vars.REINSURANCE_TENANT_PROFILE_CACHE_TTL_SECONDS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Validate deployment inputs
        run: bash .github/scripts/validate-deploy-env.sh dev

      - name: Preflight deployment host
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ENV: dev
          DEPLOY_MIN_FREE_GIB: 15
        with:
          host: ${{ vars.DEV_SERVER_HOST }}
          username: ${{ vars.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script_path: .github/scripts/deploy-host-preflight.sh
          envs: DEPLOY_ENV,DEPLOY_PATH,DEPLOY_MIN_FREE_GIB

      # Upload the compose file — the server needs nothing else from the repo.
      # Source code is already baked into the images; git is not used on the server.
      - name: Upload deployment assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEV_SERVER_HOST }}
          username: ${{ vars.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 22
          source: .github/scripts/deploy-common.sh,infrastructure/docker-compose.dev.yml
          target: /var/www/apps/dev.workphelo.datrixtechsolutions.com/work-phelo/
          strip_components: 0

      # ── 10. SSH deploy via extracted script ───────────────────────────────
      # All secrets are injected as env vars; the script lives in .github/scripts/
      # so it is version-controlled and reviewable independently of this workflow.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEV_SERVER_HOST }}
          username: ${{ vars.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 22
          command_timeout: 60m
          script_path: .github/scripts/deploy-dev.sh
          envs: GHCR_TOKEN,GHCR_USERNAME,DATABASE_URL,RABBITMQ_URL,JWT_SECRET,ALLOWED_ORIGINS,AUTH_FRONTEND_BASE_URL,AUTH_COOKIE_SECURE,AUTH_COOKIE_SAME_SITE,AUTH_GOOGLE_CLIENT_ID,AUTH_GOOGLE_CLIENT_SECRET,AUTH_GOOGLE_CALLBACK_URL,AUTH_MICROSOFT_CLIENT_ID,AUTH_MICROSOFT_CLIENT_SECRET,AUTH_MICROSOFT_CALLBACK_URL,NOTIFY_RESEND_API_KEY,NOTIFY_RESEND_FROM_EMAIL,NOTIFY_SMS_PROVIDER,NOTIFY_TERMII_API_KEY,NOTIFY_TERMII_SENDER_ID,NOTIFY_PILOSMS_API_KEY,NOTIFY_PILOSMS_SENDER_ID,SUPER_ADMIN_PASSWORD,SUPER_ADMIN_EMAIL,HR_FIELD_ENCRYPTION_KEY,HR_FIELD_HMAC_KEY,BUILD_SHA,BUILD_REF,IMAGE_PREFIX,CHANGED_SERVICES,WEB_PUBLIC_API_URL,WEB_PUBLIC_APP_BASE_URL,AUTH_TENANT_ASSET_STORAGE_PROVIDER,AUTH_TENANT_ASSET_S3_BUCKET,AUTH_TENANT_ASSET_S3_REGION,AUTH_TENANT_ASSET_S3_PREFIX,AUTH_TENANT_ASSET_SIGNED_URL_TTL_SECONDS,AUTH_TENANT_ASSET_CLOUDINARY_ROOT_FOLDER,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,REINSURANCE_DOCUMENT_STORAGE_PROVIDER,REINSURANCE_DOCUMENT_CLOUDINARY_ROOT_FOLDER,REINSURANCE_DOCUMENT_SIGNED_URL_TTL_SECONDS,INTERNAL_SERVICE_AUTH_SECRET,INTERNAL_SERVICE_AUTH_ALLOWED_SERVICES,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AUTH_SERVICE_URL,REINSURANCE_TENANT_PROFILE_CACHE_TTL_SECONDS
